name: Publish
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fovea-synthdata/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Match the tag to the tested wheel version
        shell: python
        run: |
          import email, os, pathlib, zipfile
          wheel, = pathlib.Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              metadata, = (path for path in archive.namelist() if path.endswith(".dist-info/METADATA"))
              version = email.message_from_bytes(archive.read(metadata))["Version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", f"Wheel version: {version}"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
