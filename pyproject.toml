[project]
name = "fovea-synthdata"
version = "0.1.0"
description = "Generate reproducible microscopy datasets with images, instance labels and quantitative ground truth."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fovea Lab" }]
requires-python = ">=3.12"
keywords = ["microscopy", "synthetic-data", "segmentation", "ground-truth", "cell-painting"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Image Processing"]
dependencies = ["numpy>=2.0", "pydantic>=2.7", "pyyaml>=6", "typer>=0.12"]

[project.urls]
Repository = "https://github.com/Fovea-Lab/fovea-synthdata"
Issues = "https://github.com/Fovea-Lab/fovea-synthdata/issues"
Documentation = "https://github.com/Fovea-Lab/fovea-synthdata#readme"

[project.optional-dependencies]
particle_plate = [
  "scipy>=1.13", "scikit-image>=0.24", "scikit-learn>=1.5", "pyarrow>=16", "pandas>=2.2",
  "tifffile>=2024.1", "zarr>=3.0,<4", "ome-zarr>=0.19,<0.20", "ome-zarr-models>=1.0", "pillow>=10",
]
cell_plate = ["fovea-synthdata[particle_plate]"]
report = [
  "fovea-synthdata[particle_plate]", "altair>=6.3,<7", "vl-convert-python>=1.9,<1.10",
  "umap-learn>=0.5.12,<0.6", "jinja2>=3.1",
]
app = ["streamlit>=1.40", "fovea-synthdata[report]"]
api = ["filelock>=3.16,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
mcp = ["filelock>=3.16,<4", "mcp>=1.12,<2"]

[project.scripts]
synthdata = "synthdata.cli:app"
synthdata-api = "synthdata.http_api:main"
synthdata-mcp = "synthdata.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthdata"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full default plate"]
addopts = "-m 'not slow'"
